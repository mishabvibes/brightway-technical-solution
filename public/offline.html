<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>You're offline | BrightWay</title>
  <style>
    *{box-sizing:border-box;margin:0}
    body{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:#000;color:#fff;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;text-align:center}
    main{max-width:28rem}
    img{height:4.5rem;width:auto;margin-bottom:1.5rem}
    h1{font-size:2rem;line-height:1.15;margin-bottom:.75rem}
    p{color:#d3d7df;margin-bottom:1.5rem}
    .row{display:grid;gap:.75rem}
    a,button{display:inline-flex;align-items:center;justify-content:center;min-height:3.25rem;padding:.75rem 1.4rem;
      border-radius:.5rem;border:2px solid #f09000;font:700 1rem/1.1 inherit;text-decoration:none;cursor:pointer}
    .call{background:#f09000;color:#000}
    button{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
    :focus-visible{outline:3px solid #f09000;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/brand/logo-mark.png" alt="" width="63" height="72">
    <h1>You're offline</h1>
    <p>The page could not load without a connection. Phone calls still work, so if it's urgent, call us now.</p>
    <div class="row">
      <a class="call" href="tel:+919188126866">Call +91 91881 26866</a>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </main>
  <script>
    // Reload once the connection returns (the 'online' event only; no polling loop)
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
